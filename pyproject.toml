[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "literary-graph-rag"
version = "0.1.0"
description = "Knowledge graph companion for literary analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ebooklib",
    "beautifulsoup4",
    "graphviz>=0.20",
    "httpx>=0.27",
    "neo4j>=5.20",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "streamlit>=1.40"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
literary-chat = "rag.cli:main"
literary-library = "catalog.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
